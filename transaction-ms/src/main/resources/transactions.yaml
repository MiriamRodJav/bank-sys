openapi: 3.0.3
info:
  title: Microservicio de Transacciones
  description: API para la gestión de historial de transacciones bancarias.
  version: 1.0.0
servers:
  - url: http://localhost:8082
tags:
  - name: Transacciones
paths:
  /transacciones/deposito:
    post:
      tags:
        - Transacciones
      summary: Registrar depósito
      operationId: depositar
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DepositoRequest' }
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransaccionResponse' }
        '400':
          description: Solicitud incorrecta o cuenta inválida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /transacciones/retiro:
    post:
      tags:
        - Transacciones
      summary: Registrar retiro
      operationId: retirar
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RetiroRequest' }
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransaccionResponse' }
        '400':
          description: Solicitud incorrecta, cuenta inválida o saldo insuficiente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /transacciones/transferencia:
    post:
      tags:
        - Transacciones
      summary: Registrar transferencia
      operationId: transferir
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferenciaRequest' }
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransaccionResponse' }
        '400':
          description: Solicitud incorrecta, cuenta inválida o saldo insuficiente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /transacciones/historial:
    get:
      tags:
        - Transacciones
      summary: Consultar historial
      operationId: historial
      parameters:
        - in: query
          name: estado
          schema:
            $ref: '#/components/schemas/EstadoTransaccion'
          description: El estado de la transacción a filtrar (SUCCESS, FAILED).
        - in: query
          name: tipo
          schema:
            $ref: '#/components/schemas/TipoTransaccion'
          description: El tipo de transacción a filtrar (DEPOSITO, RETIRO, TRANSFERENCIA).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TransaccionResponse' }
        '400':
          description: Parámetros de búsqueda incorrectos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: No se encontró historial para los parámetros de búsqueda
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
components:
  schemas:
    TipoTransaccion:
      type: string
      enum: [DEPOSITO, RETIRO, TRANSFERENCIA]
    EstadoTransaccion:
      type: string
      enum: [SUCCESS, FAILED, COMPENSATED]
    DepositoRequest:
      type: object
      required: [cuentaId, monto]
      properties:
        cuentaId: { type: string }
        monto: { type: number, format: double, minimum: 0.01 }
        referencia: { type: string }
    RetiroRequest:
      type: object
      required: [cuentaId, monto]
      properties:
        cuentaId: { type: string }
        monto: { type: number, format: double, minimum: 0.01 }
        referencia: { type: string }
    TransferenciaRequest:
      type: object
      required: [cuentaOrigenId, cuentaDestinoId, monto]
      properties:
        cuentaOrigenId: { type: string }
        cuentaDestinoId: { type: string }
        monto: { type: number, format: double, minimum: 0.01 }
        referencia: { type: string }
    TransaccionResponse:
      type: object
      properties:
        id: { type: string }
        tipo: { $ref: '#/components/schemas/TipoTransaccion' }
        estado: { $ref: '#/components/schemas/EstadoTransaccion' }
        monto: { type: number, format: double }
        fecha: { type: string }
        cuentaOrigenId: { type: string }
        cuentaDestinoId: { type: string }
        referencia: { type: string }
    ErrorResponse:
      type: object
      properties:
        errorCode:
          type: string
        message:
          type: string
