openapi: 3.0.1
info:
  title: Customer Microservice API
  version: 1.0.0
servers:
  - url: http://localhost:8080
tags:
  - name: Clientes
    description: Operaciones relacionadas con clientes
paths:
  /clientes:
    post:
      tags:
        - Clientes
      summary: Crear un cliente nuevo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClienteRequest'
      responses:
        '201':
          description: Cliente creado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClienteResponse'
        '400':
          description: Error de validación (datos inválidos)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflicto (por ejemplo, DNI duplicado)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags:
        - Clientes
      summary: Listar todos los clientes
      responses:
        '200':
          description: Lista de clientes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClienteResponse'
        '404':
          description: No se encontraron clientes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /clientes/{id}:
    get:
      tags:
        - Clientes
      summary: Obtener detalles de un cliente por su ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Detalles del cliente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClienteResponse'
        '404':
          description: Cliente no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
        - Clientes
      summary: Actualizar los datos de un cliente
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClienteRequest'
      responses:
        '200':
          description: Cliente actualizado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClienteResponse'
        '400':
          description: Error de validación (datos inválidos)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Cliente no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - Clientes
      summary: Eliminar un cliente
      description: Elimina un cliente por su ID. No se permite eliminar un cliente si tiene cuentas bancarias activas.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Cliente eliminado correctamente (Sin Contenido)
        '404':
          description: Cliente no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflicto (El cliente tiene cuentas bancarias activas)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    ClienteRequest:
      type: object
      required:
        - nombre
        - apellido
        - dni
      properties:
        nombre:
          type: string
          example: "Juan"
        apellido:
          type: string
          example: "Perez"
        dni:
          type: string
          description: DNI único del cliente
          example: "12345678"
        email:
          type: string
          format: email
          example: "juan.perez@example.com"
    ClienteResponse:
      type: object
      allOf:
        - $ref: '#/components/schemas/ClienteRequest'
        - type: object
          properties:
            id:
              type: integer
              format: int64
              example: 1
      required:
        - id
    ErrorResponse:
      type: object
      properties:
        errorCode:
          type: string
        message:
          type: string

    CuentaResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        numeroCuenta:
          type: string
          description: Número de cuenta único generado automáticamente.
        saldo:
          type: number
          format: double
        tipoCuenta:
          type: string
          enum:
            - AHORROS
            - CORRIENTE
        clienteId:
          type: integer
          format: int64