openapi: 3.0.3
info:
  title: Customer Microservice API
  version: 1.0.0
servers:
  - url: http://{host}/api/v1
    variables:
      host:
        default: localhost:8082

tags:
  - name: Clientes
    description: Operaciones relacionadas con clientes

paths:
  /clientes:
    post:
      tags: [Clientes]
      summary: Crear un cliente nuevo
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClienteRequest' }
            example:
              nombre: "Juan"
              apellido: "Pérez"
              dni: "12345678"
              email: "juan.perez@example.com"
      responses:
        '201':
          description: Cliente creado correctamente
          headers:
            Location:
              schema: { type: string }
              description: URL del recurso creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClienteResponse' }
        '422':
          description: Error de validación (datos inválidos)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: Conflicto (por ejemplo, DNI duplicado)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

    get:
      tags: [Clientes]
      summary: Listar todos los clientes
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 0, default: 0 }
        - in: query
          name: size
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: sort
          schema: { type: string, example: "id,desc" }
      responses:
        '200':
          description: Lista de clientes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ClienteResponse' }
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /clientes/{id}:
    get:
      tags: [Clientes]
      summary: Obtener detalles de un cliente por su ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Detalles del cliente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClienteResponse' }
        '404':
          description: Cliente no encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

    put:
      tags: [Clientes]
      summary: Actualizar los datos de un cliente
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClienteRequest' }
            example:
              nombre: "Juan"
              apellido: "Pérez"
              dni: "12345678"
              email: "juan.perez@example.com"
      responses:
        '200':
          description: Cliente actualizado correctamente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClienteResponse' }
        '422':
          description: Error de validación (datos inválidos)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Cliente no encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

    delete:
      tags: [Clientes]
      summary: Eliminar un cliente
      description: Elimina un cliente por su ID. No se permite eliminar un cliente si tiene cuentas bancarias activas.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204':
          description: Cliente eliminado correctamente (sin contenido)
        '404':
          description: Cliente no encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: Conflicto (El cliente tiene cuentas bancarias activas)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

components:
  schemas:
    ClienteRequest:
      type: object
      required: [nombre, apellido, dni]
      properties:
        nombre:
          type: string
          minLength: 1
          example: "Juan"
        apellido:
          type: string
          minLength: 1
          example: "Pérez"
        dni:
          type: string
          description: DNI único del cliente (8 dígitos)
          pattern: '^\d{8}$'
          example: "12345678"
        email:
          type: string
          format: email
          example: "juan.perez@example.com"

    ClienteResponse:
      type: object
      allOf:
        - $ref: '#/components/schemas/ClienteRequest'
        - type: object
          properties:
            id:
              type: integer
              format: int64
              example: 1
            createdAt:
              type: string
              format: date-time
              example: "2025-09-25T12:34:56Z"
            updatedAt:
              type: string
              format: date-time
              example: "2025-09-25T12:34:56Z"
      required: [id]

    ErrorResponse:
      type: object
      properties:
        errorCode:
          type: string
          description: Código único de error
          example: "DNI_DUPLICADO"
        message:
          type: string
          description: Descripción del error
          example: "El DNI ya existe"
